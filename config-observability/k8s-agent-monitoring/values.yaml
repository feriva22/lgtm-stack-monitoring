kube-prometheus-stack:
  # Disable the local database and UI
  prometheus:
    enabled: false
  alertmanager:
    enabled: false
  grafana:
    enabled: false

  # Enable CRDs installation
  crds:
    enabled: true

  # Keep the "Brain" (Operator) and the "Body" (Exporters)
  prometheusOperator:
    enabled: true
  nodeExporter:
    enabled: true
  kubeStateMetrics:
    enabled: true

  # What we need disabled for Control Plane monitoring
  kubeApiServer:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false

  # Keep the Default ServiceMonitors so Alloy can find them
  # This is where the labeling logic lives!
  defaultRules:
    create: true  # This creates the PrometheusRules (alerts)
    rules:
      etcd: false
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false
      kubeControllerManager: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  kubernetesServiceMonitors:
    enabled: true # This creates the ServiceMonitors for Kubelet, etc.