pyroscope:
  pyroscope:
    extraEnvVars:
      MY_POD_IP:
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
    extraArgs:
      memberlist.bind-addr: $(MY_POD_IP)

  replicaCount: 1

  nodeSelector:
    karpenter.sh/capacity-type: on-demand

  alloy:
    enabled: false

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

ebpfAgent:
  enabled: false