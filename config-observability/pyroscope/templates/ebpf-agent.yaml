{{- if .Values.ebpfAgent.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ printf "%s-ebpf-agent" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | default "observability" }}
  labels:
    app.kubernetes.io/name: pyroscope-ebpf-agent
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ebpf-agent
    app.kubernetes.io/part-of: pyroscope
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pyroscope-ebpf-agent
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pyroscope-ebpf-agent
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ebpf-agent
        app.kubernetes.io/part-of: pyroscope
      annotations:
        profiles.grafana.com/memory.scrape: "true"
        profiles.grafana.com/memory.port_name: http2
        profiles.grafana.com/cpu.scrape: "true"
        profiles.grafana.com/cpu.port_name: http2
    spec:
      serviceAccountName: {{ include "pyroscope.serviceAccountName" .Subcharts.pyroscope }}
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        {{- toYaml .Values.ebpfAgent.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.ebpfAgent.tolerations | nindent 8 }}
      containers:
        - name: pyroscope-ebpf
          image: "{{ .Values.ebpfAgent.image.registry }}{{ .Values.ebpfAgent.image.repository }}:{{ .Values.ebpfAgent.image.tag }}"
          imagePullPolicy: {{ .Values.ebpfAgent.image.pullPolicy }}
          args:
            - ebpf
            - --application-name=kubernetes
            - --server-address={{ .Values.ebpfAgent.serverAddress }}
            - --sample-rate={{ .Values.ebpfAgent.sampleRate }}
            {{- range .Values.ebpfAgent.extraArgs }}
            - {{ . }}
            {{- end }}
          securityContext:
            privileged: true
            runAsUser: 0
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http2
              containerPort: 4040
              protocol: TCP
          resources:
            {{- toYaml .Values.ebpfAgent.resources | nindent 12 }}
          volumeMounts:
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: false
            - name: lib-modules
              mountPath: /lib/modules
              readOnly: true
      volumes:
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
            type: Directory
        - name: lib-modules
          hostPath:
            path: /lib/modules
            type: Directory
{{- end }}
