{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-pyroscope-gateway" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace | default "observability" }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httpRoute.gateway.name | quote }}
      namespace: {{ .Values.httpRoute.gateway.namespace | default .Release.Namespace | quote }}
  {{- if .Values.httpRoute.hostnames }}
  hostnames:
    {{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: {{ printf "%s-pyroscope" .Release.Name | trunc 63 | trimSuffix "-" }}
          port: {{ .Values.pyroscope.service.port | default 4040 }}
{{- end }}
