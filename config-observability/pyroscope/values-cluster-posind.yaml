pyroscope:
  replicaCount: 1

  disableSelfProfile: true

  extraArgs:
    log.level: debug
    memberlist.advertise-addr: $(POD_IP)

  extraEnvVars:
    POD_IP:
      valueFrom:
        fieldRef:
          fieldPath: status.podIP

  rbac:
    create: true

  serviceAccount:
    create: true

  service:
    type: ClusterIP
    port: 4040
    port_name: http2
    scheme: HTTP

  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "gp3-automode-eks-dev"

  resources:
    requests:
      cpu: 200m
      memory: 256Mi

  nodeSelector:
    karpenter.sh/capacity-type: on-demand

  structuredConfig:
    multitenancy_enabled: true
    storage:
      backend: s3
      s3:
        endpoint: pyroscope-minio.observability.svc:9000
        bucket_name: grafana-pyroscope-data
        access_key_id: grafana-pyroscope
        secret_access_key: supersecret
        insecure: true

  alloy:
    enabled: false

minio:
  enabled: true
  replicas: 1
  drivesPerNode: 2
  rootUser: grafana-pyroscope
  rootPassword: supersecret
  buckets:
    - name: grafana-pyroscope-data
      policy: none
      purge: false
  persistence:
    size: 10Gi
    storageClassName: "gp3-automode-eks-dev"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    karpenter.sh/capacity-type: on-demand

ingress:
  enabled: false

httpRoute:
  enabled: false
  gateway:
    name: ""
    namespace: ""
  hostnames: []

# ------------------------------------------------------------
# eBPF Profiling Agent (DaemonSet)
# ------------------------------------------------------------
ebpfAgent:
  enabled: false
  image:
    registry: ""
    repository: grafana/pyroscope
    tag: "2.1.1"
    pullPolicy: IfNotPresent
  serverAddress: "http://pyroscope-lgtm-stack-pyroscope.observability:4040"
  sampleRate: 99
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  tolerations:
    - operator: Exists
  extraArgs: []
