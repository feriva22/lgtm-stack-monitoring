tempoGateway:
  enabled: false
tempo:
  nodeSelector:
    karpenter.sh/capacity-type: on-demand # Tempo is stateful and should run on stable on-demand instances
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: "gp3-automode-eks-dev"
  tempo:
    multitenancyEnabled: true # Enable multitenancy with a X-Scope-OrgID Header
    reportingEnabled: false #Disable reporting to Grafana Labs , prevent outgoing traffic

    metricsGenerator:
      # -- If true, enables Tempo's metrics generator (https://grafana.com/docs/tempo/next/metrics-generator/)
      enabled: true
      remoteWriteUrl: "http://mimir-gateway.observability:80/api/v1/push" # We override the tenant setting in overrides
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
          # Additional dimensions to include in service graph metrics
          dimensions:
            - http.method
            - http.status_code
        span_metrics:
          # Generate the traces_target_info metric (joins span metrics with resource attributes)
          enable_target_info: true
          # Dimensions to include in span metrics
          dimensions:
            - service.name
            - span.name
            - span.kind
            - status.code
            # ─── ADD THIS BLOCK TO EXPOSE HTTP ROUTE & METHOD ───
            - http.method
            - http.route
            - http.status_code
          # Intrinsic dimensions are always included
          intrinsic_dimensions:
            service: true
            span_name: true
            span_kind: true
            status_code: true

    overrides:
      defaults:
        metrics_generator:
          processors:
            - span-metrics
            - service-graphs

    # per_tenant_overrides: 
    #   'PT-Pos-Indonesia-Kurir-Dev':
